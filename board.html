<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판 - 포항대흥교회</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-title-board>
<a class="skip" href="#main">본문으로 바로가기</a>
<div class="demo-bar" data-when="demo">시안 단계입니다. 화면의 글, 숫자, 일정은 예시 데이터입니다.</div>
<div class="demo-bar err" data-when="load-error">일부 내용을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</div>
<div class="util"><div class="wrap">
  <span><span data-bind="church.address"></span> · 전화 <a data-bind="church.phone" data-bind-tel="church.phone"></a></span>
  <span class="util-links">
    <button type="button" class="linkbtn" data-notice="notBuilt">관리자 메일</button>
    <button type="button" class="linkbtn" data-notice="notBuilt">신앙상담</button>
  </span>
</div></div>
<header class="site"><div class="wrap bar">
  <h1 class="brand"><a href="index.html"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4v7h7v4h-7v9h-4v-9H3V9h7z"/></svg><span data-bind="church.name"></span></a></h1>
  <button type="button" class="menu-btn" data-menu-toggle aria-expanded="false" aria-controls="gnb">메뉴</button>
  <nav class="gnb" id="gnb" data-menu aria-label="주 메뉴">
    <template><div class="grp"><button type="button" class="gnb-top" data-text="label"></button>
      <div class="sub" data-menu-items><template><a data-text="label" data-href="href"></a></template></div></div></template>
  </nav>
</div></header>
<main id="main">
<div class="page-head"><div class="wrap"><h1><span data-bind="board.title"></span></h1></div></div>

<div class="wrap sec">
  <div data-when="!param:id">
    <table class="tbl"><thead><tr><th>번호</th><th>제목</th><th>날짜</th></tr></thead>
    <tbody data-list="posts:@b" id="post-list" data-page-size="10"><template><tr><td class="nw" data-l="번호" data-text="no"></td>
      <td><span class="pin" data-show="pinned">공지</span><img class="thumb" data-src="photoThumb" alt=""><a class="t" data-text="title" data-href="detailUrl"></a> <span class="chip" data-show="fileName">첨부</span></td>
      <td class="nw" data-l="날짜" data-text="dateDot"></td></tr></template></tbody></table>
    <p class="empty" data-when="!post-list" data-bind="messages.preparing"></p>
    <div class="pager" data-pager-for="post-list"></div>
  </div>
  <div class="detail" data-when="param:id" id="post-detail" data-detail="posts:@b" data-title-from="title">
    <h2 data-text="title"></h2>
    <div class="info"><span data-text="dateLong"></span></div>
    <div class="body" data-blocks="body"></div>
    <div class="figs" data-each="images"><template><figure><img data-src="thumbUrl" data-alt="title" data-viewer><figcaption><a class="passage" data-href="downloadUrl" data-external>다운로드</a></figcaption></figure></template></div>
    <div class="btns" data-show="fileName"><a class="btn" data-href="fileUrl" data-external>첨부파일 받기 · <span data-text="fileName"></span></a></div>
    <div class="pn"><a data-href="prevUrl" data-href-optional>← <span data-text="prevTitle"></span></a><a data-href="listHref">목록</a><a data-href="nextUrl" data-href-optional><span data-text="nextTitle"></span> →</a></div>
    <p class="empty" data-notfound hidden>해당 글을 찾을 수 없습니다.</p>
  </div>
</div>

</main>
<footer class="foot">
  <div class="wrap foot-grid">
    <div><strong data-bind="church.name"></strong>
      <p><span data-bind="church.address"></span><br>전화 <span data-bind="church.phone"></span><br>팩스 <span data-bind="church.fax"></span></p></div>
    <div><strong>자주 찾는 곳</strong><ul class="flinks">
      <li data-requires="pages:worship-info"><a href="page.html?s=worship-info">예배 안내</a></li>
      <li data-requires="pages:directions"><a href="page.html?s=directions">찾아오시는 길</a></li>
      <li data-requires="posts:bulletin"><a href="board.html?b=bulletin">주보</a></li>
      <li data-requires="posts:notice"><a href="board.html?b=notice">공지사항</a></li></ul></div>
    <div><strong>방문자</strong><p class="visits"><span class="pill">오늘 <span data-bind="visitor.today"></span> · 전체 <span data-bind="visitor.total"></span></span><br>
      <span class="note" data-when="visitor-demo">(예시 숫자입니다)</span></p></div>
  </div>
  <div class="wrap copy">포항대흥교회 홈페이지</div>
</footer>
<script src="js/config.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
