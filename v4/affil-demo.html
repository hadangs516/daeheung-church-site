<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소속 선택 창 데모 | 포항대흥교회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="sub.css">
<link rel="stylesheet" href="member.css">
<link rel="stylesheet" href="affil.css">
<style>
  .demo{max-width:640px;margin:0 auto;padding:40px 20px 80px}
  .demo h1{font-size:28px;color:var(--navy);margin:0 0 8px}
  .demo p{font-size:18px;line-height:1.6;margin:0 0 20px}
  .demo-btns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
  .demo-btns .btn{min-height:52px}
  .demo-out{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
  .demo-out h2{font-size:18px;margin:0 0 6px;color:var(--navy)}
  .demo-out .lab{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:14px;word-break:keep-all}
  .demo-out pre{margin:0;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:var(--text)}
  .demo-note{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<main class="demo">
  <h1>소속 선택 창 데모</h1>
  <p>세 가지 경우로 창을 열어 봅니다. 결과는 아래에 나타납니다.</p>
  <div class="demo-btns">
    <button type="button" class="btn" id="b-adult">성인 (1965-05-01)</button>
    <button type="button" class="btn" id="b-minor">미성년 (2012-03-01)</button>
    <button type="button" class="btn" id="b-unknown">생일 모름</button>
    <button type="button" class="btn line" id="b-edit">고치기 (미리 고른 것 있음)</button>
  </div>
  <div class="demo-out" aria-live="polite">
    <h2>Affil.label()</h2>
    <div class="lab" id="out-label">(아직 열지 않음)</div>
    <h2>결과 JSON</h2>
    <pre id="out-json">-</pre>
    <p class="demo-note" id="out-note"></p>
  </div>
</main>
<script src="js/affil.js"></script>
<script>
  var selected = [];
  async function run(birth, sel, btn) {
    var r = await Affil.open({ birth: birth, selected: sel || [] });
    document.getElementById('out-note').textContent = '열 때 생일: ' + (birth || '(없음)') + ' → ' + (r === null ? '취소(null)' : r.length ? r.length + '개 선택' : '무소속([])');
    if (r === null) return;
    selected = r;
    document.getElementById('out-label').textContent = Affil.label(r);
    document.getElementById('out-json').textContent = JSON.stringify(r);
  }
  document.getElementById('b-adult').onclick = function () { run('1965-05-01', []); };
  document.getElementById('b-minor').onclick = function () { run('2012-03-01', []); };
  document.getElementById('b-unknown').onclick = function () { run('', []); };
  document.getElementById('b-edit').onclick = function () {
    run('1965-05-01', selected.length ? selected : [{ id: 'men2', role: 'member' }, { id: 'kinder', role: 'teacher' }]);
  };
</script>
</body>
</html>
